<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" role="img" aria-labelledby="title desc">
  <title id="title">木と鉄で作られた鉱山用トロッコ</title>
  <desc id="desc">手前から奥へ進む一人称視点を意識した、木板と黒い鉄枠の鉱山用トロッコの前縁</desc>
  <defs>
    <linearGradient id="frontWood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7b4b27"/><stop offset=".35" stop-color="#59331c"/><stop offset="1" stop-color="#281a12"/></linearGradient>
    <linearGradient id="sideWood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b27a43"/><stop offset=".5" stop-color="#714522"/><stop offset="1" stop-color="#3b2517"/></linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#191f20"/><stop offset=".22" stop-color="#8f9694"/><stop offset=".42" stop-color="#333a3a"/><stop offset=".68" stop-color="#747b78"/><stop offset="1" stop-color="#171d1d"/></linearGradient>
    <linearGradient id="topWood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#744321"/><stop offset="1" stop-color="#24170f"/></linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="11" stdDeviation="9" flood-color="#183018" flood-opacity=".42"/></filter>
  </defs>
  <g filter="url(#drop)">
    <!-- Foremost wooden rim of the cart, viewed from the seat -->
    <path d="M20 205 L74 158 L385 158 L440 205 L420 326 L40 326 Z" fill="url(#sideWood)" stroke="#201914" stroke-width="11" stroke-linejoin="round"/>
    <path d="M20 205 L74 158 L385 158 L440 205 L230 263 Z" fill="url(#topWood)" stroke="#201914" stroke-width="9" stroke-linejoin="round"/>
    <path d="M20 205 L230 263 L230 348 L40 326 Z" fill="url(#frontWood)" stroke="#1b1511" stroke-width="10" stroke-linejoin="round"/>
    <path d="M440 205 L230 263 L230 348 L420 326 Z" fill="url(#sideWood)" stroke="#1b1511" stroke-width="10" stroke-linejoin="round"/>
    <!-- Wooden slats and grain -->
    <path d="M56 228 L225 276 M49 260 L225 307 M43 293 L225 336" stroke="#b17b48" stroke-width="5" opacity=".62"/>
    <path d="M404 228 L235 276 M411 260 L235 307 M417 293 L235 336" stroke="#d19a5d" stroke-width="5" opacity=".43"/>
    <path d="M90 180 L230 222 L370 180" fill="none" stroke="#c08a50" stroke-width="5" opacity=".45"/>
    <!-- Iron top rail / corner brackets -->
    <path d="M20 205 L74 158 L385 158 L440 205" fill="none" stroke="#171c1d" stroke-width="18" stroke-linejoin="round"/>
    <path d="M23 201 L76 162 L383 162 L437 201" fill="none" stroke="url(#iron)" stroke-width="8" stroke-linejoin="round"/>
    <path d="M38 212 L55 321 M78 168 L94 244 M422 212 L405 321 M382 168 L366 244" stroke="#202626" stroke-width="13" stroke-linecap="round"/>
    <path d="M42 214 L58 317 M81 171 L96 241 M418 214 L402 317 M379 171 L364 241" stroke="#8a8e88" stroke-width="3" opacity=".8"/>
    <!-- Rivets -->
    <g fill="#a6aaa2" stroke="#272d2c" stroke-width="4">
      <circle cx="75" cy="165" r="7"/><circle cx="385" cy="165" r="7"/>
      <circle cx="47" cy="232" r="6"/><circle cx="62" cy="295" r="6"/>
      <circle cx="413" cy="232" r="6"/><circle cx="398" cy="295" r="6"/>
    </g>
    <!-- Small worn iron plates -->
    <path d="M98 184 L126 192 M334 192 L362 184" stroke="#1e2424" stroke-width="9" stroke-linecap="round"/>
    <path d="M102 182 L125 189 M335 189 L358 182" stroke="#b1b5ac" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
  </g>
</svg>
