<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">後ろ姿の鉱山用トロッコ</title>
  <desc id="desc">手前から奥へ走り去っていく木と鉄の鉱山用トロッコを、後ろ側から見た図。後面の木板、鉄の補強帯、リベット、連結リング、後輪が見える。</desc>
  <defs>
    <linearGradient id="rearWood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8a5629"/><stop offset=".4" stop-color="#64391e"/><stop offset="1" stop-color="#2c1c12"/></linearGradient>
    <linearGradient id="rimWood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b27a43"/><stop offset=".5" stop-color="#714522"/><stop offset="1" stop-color="#3b2517"/></linearGradient>
    <linearGradient id="topWood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#744321"/><stop offset="1" stop-color="#24170f"/></linearGradient>
    <linearGradient id="farWall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4a2c17"/><stop offset="1" stop-color="#120b07"/></linearGradient>
    <linearGradient id="innerL" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2a1a10"/><stop offset="1" stop-color="#150d08"/></linearGradient>
    <linearGradient id="innerR" x1="1" y1="0" x2="0" y2="0"><stop stop-color="#4a2e19"/><stop offset="1" stop-color="#1c110a"/></linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#191f20"/><stop offset=".22" stop-color="#8f9694"/><stop offset=".42" stop-color="#333a3a"/><stop offset=".68" stop-color="#747b78"/><stop offset="1" stop-color="#171d1d"/></linearGradient>
    <linearGradient id="ironH" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7d8480"/><stop offset=".45" stop-color="#2f3636"/><stop offset="1" stop-color="#141919"/></linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#183018" flood-opacity=".42"/></filter>
  </defs>
  <g filter="url(#drop)">
    <!-- Undercarriage: axle and rear wheels seen from behind -->
    <rect x="120" y="311" width="220" height="10" fill="url(#ironH)" stroke="#1b1511" stroke-width="4"/>
    <g stroke="#1b1511" stroke-width="6" stroke-linejoin="round">
      <rect x="96" y="292" width="30" height="48" rx="6" fill="url(#iron)"/>
      <rect x="334" y="292" width="30" height="48" rx="6" fill="url(#iron)"/>
      <!-- vertical wheel flanges on the inner side -->
      <rect x="124" y="292" width="10" height="54" rx="4" fill="url(#iron)"/>
      <rect x="326" y="292" width="10" height="54" rx="4" fill="url(#iron)"/>
    </g>
    <path d="M104 299 L104 325 M356 299 L356 325" stroke="#b8bdb5" stroke-width="2.5" opacity=".55" stroke-linecap="round"/>
    <!-- Chassis beam under the body -->
    <path d="M92 284 L368 284 L362 304 L98 304 Z" fill="url(#ironH)" stroke="#1b1511" stroke-width="7" stroke-linejoin="round"/>

    <!-- Rim of the open top: far end, both sides and rear edge -->
    <path d="M62 150 L108 92 L352 92 L398 150 Z" fill="url(#topWood)" stroke="#201914" stroke-width="9" stroke-linejoin="round"/>
    <!-- Inside of the cart (dark opening) -->
    <path d="M86 134 L122 100 L338 100 L374 134 Z" fill="#120b07"/>
    <path d="M122 100 L338 100 L310 134 L150 134 Z" fill="url(#farWall)"/>
    <path d="M86 134 L122 100 L150 134 Z" fill="url(#innerL)"/>
    <path d="M374 134 L338 100 L310 134 Z" fill="url(#innerR)"/>
    <path d="M136 112 L324 112 M143 123 L317 123" stroke="#a9753f" stroke-width="3" opacity=".28"/>
    <path d="M104 118 L132 124 M356 118 L328 124" stroke="#a9753f" stroke-width="3" opacity=".22"/>
    <path d="M86 134 L122 100 L338 100 L374 134" fill="none" stroke="#201914" stroke-width="5" stroke-linejoin="round"/>
    <!-- Iron cap on far rim and side rims -->
    <path d="M108 92 L352 92" stroke="#171c1d" stroke-width="12" stroke-linecap="round"/>
    <path d="M110 91 L350 91" stroke="url(#ironH)" stroke-width="4" stroke-linecap="round" opacity=".85"/>
    <path d="M62 150 L108 92 M398 150 L352 92" stroke="#171c1d" stroke-width="12" stroke-linecap="round"/>
    <path d="M65 147 L110 91 M395 147 L350 91" stroke="#8a8e88" stroke-width="3" opacity=".7" stroke-linecap="round"/>

    <!-- Rear panel (faces the viewer) -->
    <path d="M62 150 L398 150 L372 288 L88 288 Z" fill="url(#rearWood)" stroke="#201914" stroke-width="11" stroke-linejoin="round"/>
    <!-- Wooden planks and grain -->
    <path d="M68 185 L392 185 M75 220 L385 220 M82 255 L378 255" stroke="#1d130c" stroke-width="5" opacity=".7"/>
    <path d="M70 191 L390 191 M77 226 L383 226 M84 261 L376 261" stroke="#c08a50" stroke-width="3" opacity=".35"/>
    <path d="M160 160 L152 180 M290 195 L300 214 M200 232 L194 250 M262 262 L270 280" stroke="#2a190e" stroke-width="3" stroke-linecap="round" opacity=".5"/>
    <!-- Iron top rail along the rear edge -->
    <path d="M62 150 L398 150" stroke="#171c1d" stroke-width="18" stroke-linecap="round"/>
    <path d="M66 147 L394 147" stroke="url(#ironH)" stroke-width="7" stroke-linecap="round"/>
    <!-- Iron straps -->
    <path d="M102 156 L127 280 M358 156 L333 280" stroke="#202626" stroke-width="14" stroke-linecap="round"/>
    <path d="M99 159 L124 277 M361 159 L336 277" stroke="#8a8e88" stroke-width="3" opacity=".75"/>
    <!-- Bottom iron band -->
    <path d="M88 279 L372 279" stroke="#171c1d" stroke-width="14" stroke-linecap="round"/>
    <path d="M92 276 L368 276" stroke="#8a8e88" stroke-width="3" opacity=".7"/>
    <!-- Coupling plate and ring -->
    <rect x="198" y="222" width="64" height="50" rx="6" fill="#262c2c" stroke="#171c1d" stroke-width="6"/>
    <path d="M204 227 L256 227" stroke="#8a8e88" stroke-width="2.5" opacity=".7" stroke-linecap="round"/>
    <circle cx="230" cy="250" r="13" fill="#0e1313" stroke="#171c1d" stroke-width="5"/>
    <circle cx="230" cy="250" r="13" fill="none" stroke="url(#iron)" stroke-width="3"/>
    <!-- Rivets -->
    <g fill="#a6aaa2" stroke="#272d2c" stroke-width="4">
      <circle cx="75" cy="154" r="6"/><circle cx="385" cy="154" r="6"/>
      <circle cx="105" cy="172" r="5.5"/><circle cx="114" cy="217" r="5.5"/><circle cx="123" cy="262" r="5.5"/>
      <circle cx="355" cy="172" r="5.5"/><circle cx="346" cy="217" r="5.5"/><circle cx="337" cy="262" r="5.5"/>
      <circle cx="98" cy="279" r="5"/><circle cx="362" cy="279" r="5"/>
      <circle cx="207" cy="231" r="4.5"/><circle cx="253" cy="231" r="4.5"/><circle cx="207" cy="264" r="4.5"/><circle cx="253" cy="264" r="4.5"/>
    </g>
    <!-- Small worn iron plates on the rail -->
    <path d="M150 168 L184 168 M276 168 L310 168" stroke="#1e2424" stroke-width="9" stroke-linecap="round"/>
    <path d="M153 166 L181 166 M279 166 L307 166" stroke="#b1b5ac" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
  </g>
</svg>
