<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="トロッコ問題価値観生成AIマッチング（仮称） 第1週MVP" />
  <title>トロッコ問題価値観生成AIマッチング（仮称）</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell" id="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">倫理的ジレンマ診断</p>
        <h1>トロッコ問題価値観生成AIマッチング<span>（仮称）</span></h1>
      </div>
    </header>

    <section class="question-card" aria-labelledby="questionText">
      <div class="question-heading">
        <div>
          <div class="question-index">QUESTION 01</div>
          <h2 id="questionText">
            あなたは走行中のトロッコに乗っています。<br />
            左へ傾けば崖へ、右へ傾けば1人がいる方向へ進みます。<br />
            あなたなら、どちらへトロッコを傾けますか？
          </h2>
        </div>
        <div class="progress-pill" aria-label="進捗">1 / 1</div>
      </div>
      <p class="question-note">レバーではなく、あなた自身が乗っているトロッコの進路を選びます。</p>
    </section>

    <section class="scene" aria-label="原っぱを走るトロッコの演出">
      <div class="scene-sky" aria-hidden="true"></div>
      <div class="horizon" aria-hidden="true"></div>
      <div class="meadow meadow-back" aria-hidden="true"></div>
      <div class="meadow meadow-front" aria-hidden="true"></div>
      <div class="grass-layer" aria-hidden="true"></div>

      <div class="track track-main" aria-hidden="true">
        <span class="rail rail-a"></span>
        <span class="rail rail-b"></span>
        <span class="tie tie-1"></span>
        <span class="tie tie-2"></span>
        <span class="tie tie-3"></span>
        <span class="tie tie-4"></span>
        <span class="tie tie-5"></span>
        <span class="tie tie-6"></span>
        <span class="tie tie-7"></span>
      </div>

      <div class="branch branch-left" aria-hidden="true"></div>
      <div class="branch branch-right" aria-hidden="true"></div>

      <div class="choice-landmark landmark-left" aria-hidden="true">
        <span class="cliff-top"></span>
        <span class="cliff-body"></span>
      </div>
      <div class="choice-landmark landmark-right" aria-hidden="true">
        <span class="person-head"></span>
        <span class="person-body"></span>
      </div>

      <div class="trolley-stage" id="trolleyStage" aria-live="polite">
        <div class="spark-layer spark-layer-left" id="sparkLeft" aria-hidden="true"></div>
        <div class="spark-layer spark-layer-right" id="sparkRight" aria-hidden="true"></div>
        <img class="trolley" id="trolley" src="trolley.svg" alt="木と鉄で作られた鉱山用トロッコ" />
        <div class="impact-effect" id="impactEffect" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="scene-status" id="sceneStatus" aria-live="polite">左右どちらかを選択してください</div>

      <div class="choices" id="choices" role="group" aria-label="回答選択">
        <button class="choice choice-left" data-choice="left" type="button">
          <span class="choice-label">左へ傾ける</span>
          <span class="choice-sub">崖の方向へ</span>
        </button>
        <button class="choice choice-right" data-choice="right" type="button">
          <span class="choice-label">右へ傾ける</span>
          <span class="choice-sub">1人がいる方向へ</span>
        </button>
      </div>

      <div class="result-overlay" id="resultOverlay" aria-hidden="true">
        <div class="result-panel" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
          <div class="result-kicker">YOUR DECISION</div>
          <h2 id="resultTitle">回答結果</h2>
          <p class="result-selected" id="resultSelected">あなたの回答：—</p>
          <div class="comparison" id="comparison">
            <div class="comparison-header">
              <span>回答傾向の比較</span>
              <span class="comparison-note">モックデータ</span>
            </div>
            <div class="comparison-list" id="comparisonList"></div>
          </div>
          <p class="result-disclaimer">ここで表示している一致率は、今回の問題に対する回答パターンの近さを示すものです。倫理的な優劣を表すものではありません。</p>
          <button class="next-button" type="button" id="nextButton" disabled>次の問題へ（今後実装）</button>
          <button class="restart-button" type="button" id="restartButton">もう一度この問題に回答する</button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
